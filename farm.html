<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07111d"><meta name="description" content="Clank City Farm Life — a cozy 3D farming adventure inside Clank City."><title>CLANK CITY FARM LIFE</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#07111d;--panel:#0c1d2a;--line:#21465a;--cyan:#65e1f7;--muted:#88a7b8;--cream:#f1f0d7}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:#e9f7fc}button{font:inherit;touch-action:manipulation}.game{position:relative;width:100%;height:100dvh;overflow:hidden;background:#a9d4c2}#world{position:absolute;inset:0}#world canvas{width:100%;height:100%;display:block}.topbar{position:absolute;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px;gap:8px;pointer-events:none}.brand,.hud,.back{pointer-events:auto;background:#071522dd;border:1px solid #244b5e;backdrop-filter:blur(8px);box-shadow:0 8px 25px #06101b30}.brand{padding:9px 12px;display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:.09em;font-size:12px}.mark{width:30px;height:30px;border:1px solid var(--cyan);display:grid;place-items:center;color:var(--cyan);font:11px monospace}.brand small{display:block;font:8px monospace;color:#85a7b9;letter-spacing:.12em;margin-top:3px}.hud{padding:9px 11px;display:flex;gap:13px;font:10px monospace;color:#8baebe}.hud b{display:block;color:#e8f9ff;font-size:13px;margin-top:4px}.back{padding:10px 12px;color:var(--cyan);text-decoration:none;font:10px monospace}.help{position:absolute;top:76px;left:50%;transform:translateX(-50%);background:#071522c9;border:1px solid #23495d;padding:7px 11px;color:#b6d0dc;font:9px monospace;white-space:nowrap;pointer-events:none}.message{position:absolute;left:50%;top:118px;transform:translateX(-50%);padding:9px 14px;background:#071522e8;border:1px solid #4c8496;color:#d8f8ff;font:11px monospace;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.message.show{opacity:1}.bottom{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0);padding:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none}.tools,.actions{pointer-events:auto;display:flex;gap:6px;padding:7px;background:#071522dd;border:1px solid #244b5e;backdrop-filter:blur(8px)}.tool{min-width:57px;padding:9px 8px;border:1px solid #2b4e60;background:#102635;color:#a8c5d2;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px}.tool .emoji{font-size:20px;line-height:1}.tool.active{border-color:var(--cyan);background:#164052;color:#eaffff;box-shadow:inset 0 0 0 1px #65e1f72b}.action{min-width:74px;height:64px;border:1px solid #5bc9e3;background:#0e394c;color:#e4fbff;font:11px monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.action b{font-size:22px;font-weight:400}.joystick{width:120px;height:120px;position:relative;border-radius:50%;background:#071522a8;border:1px solid #366074;pointer-events:auto;touch-action:none;display:none}.joy-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;transform:translate(-50%,-50%);border-radius:50%;background:#1b4558;border:2px solid #71dff3;box-shadow:0 4px 15px #0005}.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);font:10px monospace;color:#d2f4ff;pointer-events:none}@media(max-width:760px){.brand{padding:7px 9px;font-size:10px}.mark{width:27px;height:27px}.hud{gap:8px;padding:8px;font-size:9px}.hud b{font-size:12px}.back{font-size:9px;padding:9px}.help{top:70px;font-size:8px}.bottom{padding:10px;align-items:flex-end}.joystick{display:block;flex:0 0 110px;width:110px;height:110px}.joy-knob{width:44px;height:44px}.tools{gap:4px;padding:5px}.tool{min-width:45px;padding:7px 4px;font-size:9px}.tool .emoji{font-size:18px}.actions{padding:5px;gap:4px}.action{min-width:57px;height:59px;font-size:9px}.action b{font-size:19px}}@media(max-width:390px){.hud{gap:5px}.hud .stat:nth-child(3){display:none}.tool{min-width:39px}.joystick{width:95px;height:95px;flex-basis:95px}.action{min-width:50px}}.loading{position:absolute;inset:0;display:grid;p </style></head><body><main class="game"><div id="world"></div><div class="loading" id="loading">GROWING YOUR FARM…</div><header class="topbar"><div class="brand"><span class="mark">CC</span><span>CLANK CITY<small>FARM LIFE · 3D</small></span></div><div class="hud"><div class="stat">DAY<b id="day">01 · SPRING</b></div><div class="stat">COINS<b id="coins">120 G</b></div><div class="stat">HARVEST<b id="harvest">0</b></div></div><a class="back" href="./index.html">← CITY</a></header><div class="help">WASD / ARROWS TO MOVE · E TO USE · TOUCH JOYSTICK ON MOBILE</div><div class="message" id="message">Welcome to your farm!</div><div class="bottom"><div class="joystick" id="joystick"><div class="joy-knob" id="joyKnob"></div></div><div class="tools" id="tools"><button class="tool active" data-tool="hoe"><span class="emoji">⛏</span>HOE</button><button class="tool" data-tool="seed"><span class="emoji">🌱</span>SEEDS</button><button class="tool" data-tool="water"><span class="emoji">💧</span>WATER</button><button class="tool" data-tool="harvest"><span class="emoji">🌾</span>HARVEST</button></div><div class="actions"><button class="action" id="use"><b>↵</b>USE</button><button class="action" id="sell"><b>＋</b>SELL<br>HARVEST</button></div></div></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const $=id=>document.getElementById(id);const world=$('world');let scene,camera,renderer,player,clock;let move={x:0,z:0},keys={},tool='hoe',coins=120,harvest=0,day=1,season=0,elapsed=0,lastGrowth=0,toastTimer;const tileSize=1.35,gridN=9,plots=new Map(),plants=new Map(),raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let groundTiles=[],targetPlot=null;
const seasonNames=['SPRING','SUMMER','AUTUMN','WINTER'];const colors={grass:0x72b77a,grass2:0x83c481,soil:0x76513a,tilled:0x6c472f,water:0x4b9fce,leaf:0x38995b,fruit:0xffd15c};
function say(t){$('message').textContent=t;$('message').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('message').classList.remove('show'),2100)}
function save(){const state={coins,harvest,day,season,elapsed,plots:Array.from(plots.entries()),plants:Array.from(plants.entries()).map(([k,v])=>[k,v.stage,v.watered,v.growth])};try{localStorage.setItem('clankcity-farm-save',JSON.stringify(state))}catch{}}
function load(){try{let s=JSON.parse(localStorage.getItem('clankcity-farm-save')||'null');if(!s)return;coins=s.coins??120;harvest=s.harvest??0;day=s.day??1;season=s.season??0;elapsed=s.elapsed??0;(s.plots||[]).forEach(([k,v])=>plots.set(k,v));(s.plants||[]).forEach(([k,stage,watered,growth])=>plants.set(k,{stage,watered,growth}))}catch{}}
function hud(){$('day').textContent=String(day).padStart(2,'0')+' · '+seasonNames[season];$('coins').textContent=coins+' G';$('harvest').textContent=harvest}
function mat(color,rough=.9){return new THREE.MeshStandardMaterial({color,roughness:rough})}
const mGrass=mat(colors.grass),mGrass2=mat(colors.grass2),mSoil=mat(colors.soil),mTilled=mat(colors.tilled),mWood=mat(0x8e6443),mRoof=mat(0x9d5947),mCream=mat(0xf2d9a5),mLeaf=mat(colors.leaf),mTrunk=mat(0x725038),mWater=mat(colors.water,.35);
function box(parent,x,y,z,sx,sy,sz,material){let o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function buildWorld(){scene=new THREE.Scene();scene.background=new THREE.Color(0xa9d4c2);scene.fog=new THREE.Fog(0xa9d4c2,20,52);camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;world.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8fff3,0x6b7351,2.2));let sun=new THREE.DirectionalLight(0xfff0d1,3);sun.position.set(-8,16,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);
let floor=box(scene,0,-.22,0,36,.4,36,mGrass);floor.receiveShadow=true;
for(let x=-17;x<17;x+=1.5)for(let z=-17;z<17;z+=1.5){if(Math.random()>.55){let tuft=box(scene,x+Math.random()*.5,.01,z+Math.random()*.5,.06,.12,.06,Math.random()>.5?mGrass2:mLeaf);tuft.rotation.y=Math.random()*3}}
const farmStart=-((gridN*tileSize)/2)+tileSize/2;for(let i=0;i<gridN;i++)for(let j=0;j<gridN;j++){let x=farmStart+i*tileSize,z=farmStart+j*tileSize,key=i+','+j;let tile=box(scene,x,.02,z,tileSize-.05,.08,tileSize-.05,((i+j)%2)?mGrass:mGrass2);tile.userData={plot:key,x,z};groundTiles.push(tile);plots.set(key,plots.get(key)||'grass')}
buildHouse(-7,-5);buildBarn(7,-5);buildFence();buildTrees();buildPath();buildPond(8,6);
player=new THREE.Group();scene.add(player);let body=box(player,0,.58,0,.48,.68,.34,mat(0x3d8fbd));body.castShadow=true;let head=new THREE.Mesh(new THREE.BoxGeometry(.42,.42,.42),mat(0xf0c99b));head.position.y=1.15;head.castShadow=true;player.add(head);box(player,-.12,1.2,.215,.055,.06,.025,mat(0x263c4b));box(player,.12,1.2,.215,.055,.06,.025,mat(0x263c4b));box(player,0,1.42,0,.48,.12,.48,mat(0x5d493b));box(player,0,1.5,0,.52,.08,.52,mat(0xead8a4));box(player,-.13,.16,0,.16,.3,.2,mat(0x4c3d37));box(player,.13,.16,0,.16,.3,.2,mat(0x4c3d37));player.position.set(0,0,4);clock=new THREE.Clock();restorePlots();updatePlots();camera.position.set(8,11,12);camera.lookAt(player.position);renderer.domElement.addEventListener('pointerdown',onWorldTap);$('loading').classList.add('hide')}
function buildHouse(x,z){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(g,0,1.25,0,4.2,2.5,3.5,mCream);let roof=box(g,0,2.85,0,4.8,.3,4,mRoof);roof.rotation.z=.08;box(g,0,.9,1.78,.8,1.8,.12,mWood);box(g,-1.25,1.55,1.79,.7,.7,.12,mat(0x7bb8cf));box(g,1.25,1.55,1.79,.7,.7,.12,mat(0x7bb8cf));box(g,0,2.0,-2.1,.65,1,.65,mTrunk)}
function buildBarn(x,z){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(g,0,1,0,3.8,2,3,mWood);let roof=box(g,0,2.25,0,4.2,.35,3.4,mat(0x8b4d3e));roof.rotation.z=.1;box(g,0,.85,1.55,1.25,1.45,.12,mat(0x4c3528));box(g,-1.15,1.4,1.56,.65,.65,.12,mat(0xf4d5a0))}
function buildFence(){for(let i=-7;i<=7;i++){if(Math.abs(i)<3)continue;for(let z of [-7,7]){box(scene,i, .48,z,.12,.85,.12,mCream);box(scene,i,.65,z,.18,.12,.18,mWood)}for(let x of [-7,7]){box(scene,x,.48,i,.12,.85,.12,mCream);box(scene,x,.65,i,.18,.12,.18,mWood)}}}
function buildTrees(){for(let [x,z] of [[-10,-8],[-12,-2],[-10,6],[-8,10],[10,-9],[12,-1],[11,9],[4,11],[-3,-11]]){box(scene,x,.8,z,.45,1.6,.45,mTrunk);let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.25,0),mat(Math.random()>.5?0x4c9a59:0x5da968));crown.position.set(x,2.15,z);crown.castShadow=true;scene.add(crown)}}
function buildPath(){let path=box(scene,0,.02,9,2.8,.08,12,mat(0xcab58c));path.receiveShadow=true}
function buildPond(x,z){let p=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.5,.12,16),mWater);p.position.set(x,.02,z);p.scale.z=.8;scene.add(p);for(let i=0;i<5;i++){let r=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,.1,8),mat(0x5d8f61));r.position.set(x+Math.random()*2-1,.15,z+Math.random()*2-1);scene.add(r)}}
function restorePlots(){for(let [key,status] of plots){if(status==='tilled'||status==='watered')setTileVisual(key,status)}}
function plotPosition(key){let [i,j]=key.split(',').map(Number);return {x:-((gridN*tileSize)/2)+tileSize/2+i*tileSize,z:-((gridN*tileSize)/2)+tileSize/2+j*tileSize}}
function setTileVisual(key,status){let tile=groundTiles.find(t=>t.userData.plot===key);if(!tile)return;tile.material=status==='grass'?(((key.split(',').map(Number).reduce((a,b)=>a+b,0))%2)?mGrass:mGrass2):status==='watered'?mWater:mTilled;tile.position.y=status==='grass'?.02:.065}
function updatePlots(){for(let [key,status] of plots){setTileVisual(key,status);let old=plants.get(key);if(old){drawPlant(key,old)}}}
function drawPlant(key,p){let old=scene.getObjectByName('plant-'+key);if(old)scene.remove(old);if(p.stage<=0)return;let pos=plotPosition(key),g=new THREE.Group();g.name='plant-'+key;g.position.set(pos.x,.12,pos.z);scene.add(g);let h=.18+p.stage*.18;box(g,0,h/2,0,.08,h,.08,mLeaf);for(let k=0;k<Math.min(4,p.stage+1);k++){let leaf=box(g,(k%2?1:-1)*.16,h*.45+k*.08,0,.22,.08,.08,mLeaf);leaf.rotation.z=(k%2?-.5:.5)}if(p.stage>=3){let fruit= new THREE.Mesh(new THREE.SphereGeometry(.13,8,6),mat(0xffd45d));fruit.position.set(.12,h+.05,0);g.add(fruit)}}
function getNearPlot(){let best=null,dist=2.05;for(let t of groundTiles){let d=Math.hypot(t.userData.x-player.position.x,t.userData.z-player.position.z);if(d<dist){dist=d;best=t}}return best}
function useTool(){let t=getNearPlot();if(!t){say('Move closer to a farm plot.');return}let key=t.userData.plot,status=plots.get(key)||'grass',p=plants.get(key);if(tool==='hoe'){if(status==='grass'){plots.set(key,'tilled');setTileVisual(key,'tilled');say('Soil tilled. Plant a seed next!')}else say('This plot is already prepared.')}
else if(tool==='seed'){if(status!=='tilled'&&status!=='watered'){say('Use the hoe on grass first.');return}if(p){say('A crop is already growing here.');return}plants.set(key,{stage:1,watered:false,growth:0});drawPlant(key,plants.get(key));say('Turnip seeds planted! Water them daily.')}
else if(tool==='water'){if(!p){say('Plant seeds before watering.');return}p.watered=true;plots.set(key,'watered');setTileVisual(key,'watered');say('Crop watered. It will grow over time.')}
else if(tool==='harvest'){if(!p||p.stage<3){say('Not ready to harvest yet.');return}plants.delete(key);plots.set(key,'tilled');setTileVisual(key,'tilled');let obj=scene.getObjectByName('plant-'+key);if(obj)scene.remove(obj);harvest++;hud();say('Fresh turnip harvested!');}
save()}
function onWorldTap(e){if(e.target.closest?.('.bottom,.topbar,.help,.message'))return;let r=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-(e.clientY-r.top)/r.height*2+1;raycaster.setFromCamera(pointer,camera);let hits=raycaster.intersectObjects(groundTiles);if(hits.length){let tile=hits[0].object;let pos=tile.userData;player.position.x=pos.x;player.position.z=pos.z;useTool()}}
function selectTool(t){tool=t;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));say(t.toUpperCase()+' selected')}
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>selectTool(b.dataset.tool)));$('use').addEventListener('click',useTool);$('sell').addEventListener('click',()=>{if(!harvest){say('Harvest crops before selling.');return}coins+=harvest*35;let sold=harvest;harvest=0;hud();save();say('Sold '+sold+' turnips for '+(sold*35)+' G!')});
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='e'||e.key==='E')useTool();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joy=$('joystick'),knob=$('joyKnob');let joyId=null;function joyMove(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.34,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}move.x=dx/max;move.z=dy/max;knob.style.left='calc(50% + '+dx+'px)';knob.style.top='calc(50% + '+dy+'px'}function joyEnd(){joyId=null;move.x=move.z=0;knob.style.left='50%';knob.style.top='50%'}joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>joy.addEventListener(ev,joyEnd));
function update(time,dt){let x=move.x,z=move.z;if(keys.w||keys.arrowup)z-=1;if(keys.s||keys.arrowdown)z+=1;if(keys.a||keys.arrowleft)x-=1;if(keys.d||keys.arrowright)x+=1;let len=Math.hypot(x,z);if(len>1){x/=len;z/=len}let speed=dt*3.8;player.position.x+=x*speed;player.position.z+=z*speed;player.position.x=THREE.MathUtils.clamp(player.position.x,-7.5,7.5);player.position.z=THREE.MathUtils.clamp(player.position.z,-7.5,7.5);if(len>.05){player.rotation.y=Math.atan2(x,z);player.position.y=Math.abs(Math.sin(time*12))*.035}
let desired=new THREE.Vector3(player.position.x+7,player.position.y+9,player.position.z+10);camera.position.lerp(desired,Math.min(1,dt*3));camera.lookAt(player.position.x,player.position.y+.4,player.position.z);
elapsed+=dt;if(elapsed>180){elapsed=0;day++;season=Math.floor((day-1)/7)%4;hud();say('A new day begins. Keep tending your crops!');save()}
if(time-lastGrowth>15){lastGrowth=time;for(let [key,p] of plants){if(p.watered){p.growth++;p.stage=Math.min(3,p.stage+1);p.watered=false;plots.set(key,'tilled');setTileVisual(key,'tilled');drawPlant(key,p)}}save()}
}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);update(clock.elapsedTime,dt);renderer.render(scene,camera)}
function resize(){if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
load();hud();buildWorld();animate();addEventListener('resize',resize);addEventListener('pagehide',save);
</script></body></html>
